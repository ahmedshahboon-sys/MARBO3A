services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marbo3a -d marbo3a"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  turn:
    image: coturn/coturn:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    command:
      - -n
      - --no-cli
      - --fingerprint
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_REALM:-marbo3a.ly}
      - --server-name=${TURN_REALM:-marbo3a.ly}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --no-loopback-peers
      - --log-file=stdout
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      turn:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - postgres_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      'while true; do
        export PGPASSWORD="$${POSTGRES_PASSWORD}";
        TS=$$(date +%Y%m%d-%H%M%S);
        pg_dump -h db -U "$${POSTGRES_USER:-marbo3a}" -d "$${POSTGRES_DB:-marbo3a}" -Fc -f "/backups/marbo3a-$${TS}.dump" && echo "backup completed: $${TS}";
        find /backups -type f -name "marbo3a-*.dump" -mtime +14 -delete;
        sleep 86400;
      done'

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  postgres_backups:
