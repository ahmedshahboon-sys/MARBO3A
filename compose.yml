services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marbo3a -d marbo3a"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]

  turn:
    image: coturn/coturn:4.18.0-r0
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49663:49152-49663/udp"
      - "49152-49663:49152-49663/tcp"
    command:
      - -n
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=$${TURN_SECRET}
      - --realm=$${TURN_REALM:-marbo3a.ly}
      - --server-name=$${TURN_REALM:-marbo3a.ly}
      - --external-ip=$${TURN_EXTERNAL_IP}
      - --listening-port=3478
      - --min-port=49152
      - --max-port=49663
      - --no-tls
      - --no-multicast-peers
      - --log-file=stdout
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':0D96 ' /proc/net/udp /proc/net/udp6 /proc/net/tcp /proc/net/tcp6 2>/dev/null"]
      interval: 10s
      timeout: 4s
      retries: 8
      start_period: 12s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      MARBO3A_RELEASE_SHA: ${MARBO3A_RELEASE_SHA:-unknown}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes: [uploads_data:/app/uploads]
    ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose: ["3000"]

  gate:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:3000:8080"]
    volumes:
      - ./ops/maintenance-gate.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/maintenance:/usr/share/nginx/html/maintenance:ro
      - ./frontend/public/brand/official:/usr/share/nginx/html/brand/official:ro
      - ./.runtime/maintenance:/run/marbo3a-maintenance:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/__gate_health >/dev/null 2>&1"]
      interval: 10s
      timeout: 4s
      retries: 8
      start_period: 3s

  # Local emergency copy only. This volume lives on the same host and is not an offsite backup.
  # Production protection is owned by ops/backup-database.sh: encrypted dump + checksum + optional offsite copy,
  # followed by ops/verify-backup-restore.sh on a controlled schedule.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    volumes: [postgres_backups:/backups]
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      'while true; do
        export PGPASSWORD="$${POSTGRES_PASSWORD}";
        TS=$$(date +%Y%m%d-%H%M%S);
        pg_dump -h db -U "$${POSTGRES_USER:-marbo3a}" -d "$${POSTGRES_DB:-marbo3a}" -Fc -f "/backups/marbo3a-$${TS}.dump" && echo "local emergency backup completed: $${TS}";
        find /backups -type f -name "marbo3a-*.dump" -mtime +7 -delete;
        sleep 86400;
      done'

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  postgres_backups:
