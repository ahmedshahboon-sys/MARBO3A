<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FF7A00"><title>مربوعة — بدون اتصال</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#2a1b11,#111318 48%);color:#f6f4ef;font-family:Cairo,"Noto Sans Arabic",Tahoma,Arial,sans-serif}.card{width:min(460px,100%);text-align:center;padding:28px 22px;border:1px solid #343942;border-radius:20px;background:#181c24;box-shadow:0 24px 70px #0008}.logo{width:96px;height:96px;object-fit:contain;margin:auto;border-radius:22px}h1{margin:14px 0 6px;font-size:21px}p{color:#a8afba;line-height:1.8;font-size:13px}button{width:100%;min-height:42px;margin-top:12px;border:0;border-radius:12px;background:#ff7a00;color:#111318;font:inherit;font-weight:900;font-size:13px}</style></head><body><main class="card"><img class="logo" src="/brand/official/marbo3a-mark.png" alt="مربوعة"><h1>الاتصال مقطوع</h1><p>مربوعة محفوظة عندك، لكن المحتوى الجديد يحتاج إنترنت. أول ما يرجع الاتصال تقدر تكمل عادي.</p><button onclick="location.reload()">إعادة المحاولة</button></main><script>addEventListener('online',()=>location.reload())</script></body></html>
