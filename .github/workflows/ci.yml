name: MARBO3A CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify exact workflow SHA
        shell: bash
        working-directory: .
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify deterministic lockfiles
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          (cd frontend && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          if ! git diff --exit-code -- backend/package-lock.json frontend/package-lock.json; then
            echo "Lockfiles are stale. Regenerate them locally and commit the result in the same PR." >&2
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    needs: [lockfiles]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marbo3a
          POSTGRES_USER: marbo3a
          POSTGRES_PASSWORD: marbo3a_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marbo3a -d marbo3a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://marbo3a:marbo3a_ci@127.0.0.1:5432/marbo3a
      REDIS_URL: redis://127.0.0.1:6379
      APP_ORIGIN: http://127.0.0.1:4000
      UPLOAD_DIR: /tmp/marbo3a-uploads
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /tmp/marbo3a-uploads
      STORAGE_PUBLIC_PREFIX: /api/uploads
      TURN_HOST: 127.0.0.1
      TURN_EXTERNAL_IP: 127.0.0.2
      TURN_SECRET: ci_turn_secret_not_for_production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify exact workflow SHA
        shell: bash
        working-directory: .
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Runtime route ownership inventory
        env:
          ROUTE_INVENTORY_OUT: /tmp/marbo3a-runtime-route-inventory.json
        run: npm run test:routes
      - name: Syntax check every backend module
        shell: bash
        run: |
          set -euo pipefail
          for file in *.mjs; do echo "checking $file"; node --check "$file"; done
      - run: npm test
      - name: Verify migration naming and clean database
        shell: bash
        run: |
          set -euo pipefail
          duplicates="$(find migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | sort | uniq -d)"
          # Historical production migrations 021 and 034 already share prefixes.
          # Their filenames are immutable because renaming an applied migration would make it look new.
          test "$(find migrations -maxdepth 1 -type f -name '021_*.sql' -printf '%f\n' | sort | paste -sd ',' -)" = "021_group13_performance.sql,021_stories.sql" || { echo "Historical 021 migration set changed" >&2; exit 1; }
          test "$(find migrations -maxdepth 1 -type f -name '034_*.sql' -printf '%f\n' | sort | paste -sd ',' -)" = "034_room_rail_admin_controls.sql,034_site_font.sql" || { echo "Historical 034 migration set changed" >&2; exit 1; }
          unexpected="$(printf '%s\n' "$duplicates" | grep -Ev '^(021|034)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected duplicate migration prefixes: $unexpected" >&2
            exit 1
          fi
          npm run migrate
          expected="$(find migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)"
          actual="$(psql "$DATABASE_URL" -Atc 'SELECT name FROM schema_migrations ORDER BY name')"
          if [ "$actual" != "$expected" ]; then
            echo "=== EXPECTED MIGRATIONS ==="
            printf '%s\n' "$expected"
            echo "=== APPLIED MIGRATIONS ==="
            printf '%s\n' "$actual"
            exit 1
          fi
      - name: Verify Group 7 TURN capacity plan
        run: node scripts/group7-turn-capacity.mjs
      - name: API integration smoke test
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /app/uploads
          sudo chown -R "$(id -u):$(id -g)" /app/uploads
          mkdir -p "$UPLOAD_DIR" "$STORAGE_LOCAL_DIR"
          LOG=/tmp/marbo3a-api.log
          : >"$LOG"
          npm start >"$LOG" 2>&1 &
          PID=$!
          cleanup(){ kill "$PID" >/dev/null 2>&1 || true; }
          dump_log(){ echo "=== MARBO3A API STARTUP LOG ==="; cat "$LOG" || true; echo "=== END API STARTUP LOG ==="; }
          trap cleanup EXIT
          READY=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/api/health >/dev/null 2>&1; then READY=1; break; fi
            if ! kill -0 "$PID" >/dev/null 2>&1; then dump_log; echo "API process exited before becoming healthy" >&2; exit 1; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then dump_log; echo "API did not become healthy in time" >&2; exit 1; fi
          curl -fsS http://127.0.0.1:4000/api/health
          test "$(curl -sS -o /tmp/me.json -w '%{http_code}' http://127.0.0.1:4000/api/auth/me)" = "401" || { dump_log; cat /tmp/me.json || true; exit 1; }
          test "$(curl -sS -o /tmp/push.json -w '%{http_code}' http://127.0.0.1:4000/api/push/config)" = "200" || { dump_log; cat /tmp/push.json || true; exit 1; }
          node -e "const x=require('/tmp/push.json'); if(typeof x.enabled!=='boolean') process.exit(1)" || { dump_log; exit 1; }
          node scripts/group1-runtime.mjs || { dump_log; exit 1; }
          node scripts/group2-realtime-runtime.mjs || { dump_log; exit 1; }
          node scripts/group3-account-security.mjs || { dump_log; exit 1; }
          node scripts/group4-social-lifecycle.mjs || { dump_log; exit 1; }
          node scripts/group5-stories-media.mjs || { dump_log; exit 1; }
          node scripts/group6-messaging-calls.mjs || { dump_log; exit 1; }
          node scripts/group7-rtc-live.mjs || { dump_log; exit 1; }
          node scripts/group8-settings-privacy.mjs || { dump_log; exit 1; }
          node scripts/group9-admin-ops.mjs || { dump_log; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    needs: [lockfiles]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify exact workflow SHA
        shell: bash
        working-directory: .
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Reject browser-native dialogs in product UI
        shell: bash
        run: |
          set -euo pipefail
          if grep -RPIn --include='*.js' '(^|[^.[:alnum:]_$])(window\.)?(alert|confirm|prompt)\(' app; then
            echo "Use AppDialog/toasts instead of browser-native dialogs" >&2
            exit 1
          fi
      - run: npm run build
      - name: Explicit frontend contract suite
        run: npm run test:contracts
      - name: Responsive geometry matrix
        run: npm run test:responsive
      - name: Runtime browser and PWA smoke
        run: npm run test:runtime-browser
      - name: Verify generated PWA assets
        shell: bash
        run: |
          set -euo pipefail
          test -s public/pwa-192.png
          test -s public/pwa-512.png
          test -s public/pwa-maskable-512.png
          test -s public/apple-touch-icon.png
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('./public/manifest.webmanifest','utf8')); const i=m.icons||[]; if(!i.some(x=>x.src==='/pwa-192.png')||!i.some(x=>x.src==='/pwa-512.png')||!i.some(x=>x.purpose==='maskable')) process.exit(1)"
