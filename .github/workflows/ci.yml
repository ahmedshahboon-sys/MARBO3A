name: MARBO3A CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install --no-audit --no-fund
      - name: Syntax check every backend module
        shell: bash
        run: |
          set -euo pipefail
          for file in *.mjs; do echo "checking $file"; node --check "$file"; done
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: backend-lock
          path: backend/package-lock.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-lock
          path: frontend/package-lock.json
          if-no-files-found: error
