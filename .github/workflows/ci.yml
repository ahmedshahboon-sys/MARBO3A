name: MARBO3A CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install --no-audit --no-fund
      - run: node --check server.mjs
      - run: node --check instrumentation.mjs
      - run: node --check platform-extra.mjs
      - run: node --check core-extensions.mjs
      - run: node --check social-extensions.mjs
      - run: node --check direct-extensions.mjs
      - run: node --check feed-extensions.mjs
      - run: node --check social-ui-backend.mjs
      - run: node --check release-hardening.mjs
      - run: node --check media-social.mjs
      - run: node --check launch-completion.mjs
      - run: node --check v1-completion.mjs
      - run: node --check generate-vapid.mjs
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
