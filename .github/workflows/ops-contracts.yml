name: MARBO3A Operations Contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify exact workflow SHA
        shell: bash
        working-directory: .
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/deploy-production.sh
          bash -n ops/disk-monitor.sh
          bash -n ops/audit-foundation.sh
          bash -n ops/setup-turn.sh
          bash -n ops/audit-turn-runtime.sh
          bash -n ops/backup-database.sh
          bash -n ops/verify-backup-restore.sh
      - name: Validate compose gate topology
        shell: bash
        run: |
          set -euo pipefail
          : > .env
          docker compose config --format json > /tmp/marbo3a-compose.json
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/marbo3a-compose.json'))
          s=c['services']
          assert {'api','web','gate','db','redis','turn','backup'} <= set(s)
          assert not s['web'].get('ports'), 'web must stay internal behind gate'
          ports=s['gate'].get('ports') or []
          assert any(str(p.get('published'))=='3000' and str(p.get('target'))=='8080' for p in ports), ports
          PY
      - name: Validate TURN relay capacity wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q '49152-49663:49152-49663/udp' compose.yml
          grep -q '49152-49663:49152-49663/tcp' compose.yml
          grep -q -- '--min-port=49152' compose.yml
          grep -q -- '--max-port=49663' compose.yml
          grep -q '49152:49663/udp' ops/setup-turn.sh
          grep -q '49152:49663/tcp' ops/setup-turn.sh
      - name: Validate maintenance nginx config
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/ops/maintenance-gate.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/ops/maintenance:/usr/share/nginx/html/maintenance:ro" \
            nginx:1.27-alpine nginx -t
      - name: Exercise maintenance gate runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/marbo3a-maintenance-state
          touch /tmp/marbo3a-maintenance-state/enabled
          NAME="marbo3a-gate-ci-$RANDOM"
          cleanup(){ docker rm -f "$NAME" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$NAME" \
            -p 127.0.0.1:18080:8080 \
            -v "$PWD/ops/maintenance-gate.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/ops/maintenance:/usr/share/nginx/html/maintenance:ro" \
            -v "/tmp/marbo3a-maintenance-state:/run/marbo3a-maintenance:ro" \
            nginx:1.27-alpine >/dev/null
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18080/__gate_health >/dev/null 2>&1 && break
            sleep 1
          done
          test "$(curl -sS -o /tmp/maintenance.html -w '%{http_code}' http://127.0.0.1:18080/)" = "503"
          grep -q 'مربوعة' /tmp/maintenance.html
          curl -sSI http://127.0.0.1:18080/ | grep -qi '^Retry-After: 30'
      - name: Verify maintenance contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/api/system/maintenance' ops/maintenance/index.html
          grep -q 'maintenance_mode' backend/request-foundation.mjs
          grep -q 'MaintenanceRuntime' frontend/app/AppRuntime.js
          grep -q 'docker builder prune -af' ops/deploy-production.sh
          grep -q 'MARBO3A_DISK_WARN_PERCENT:-70' ops/disk-monitor.sh
          grep -q 'MARBO3A_DISK_CRITICAL_PERCENT:-85' ops/disk-monitor.sh
          grep -q 'backup_success' ops/backup-database.sh
          grep -q 'restore_success' ops/verify-backup-restore.sh
          grep -q '/api/admin/operations' backend/routes/core-admin-control.mjs
