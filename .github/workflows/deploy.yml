name: MARBO3A Deploy

on:
  workflow_dispatch:

concurrency:
  group: marbo3a-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MARBO3A_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.MARBO3A_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST"; mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/marbo3a_deploy; chmod 600 ~/.ssh/marbo3a_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
      - name: Deploy MARBO3A
        shell: bash
        env:
          SSH_HOST: ${{ secrets.MARBO3A_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.MARBO3A_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.MARBO3A_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/marbo3a}"
          ssh -i ~/.ssh/marbo3a_deploy -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "set -euo pipefail; cd '$DEPLOY_PATH'; PREV=\$(git rev-parse HEAD); git fetch origin main; git checkout main; git reset --hard origin/main; chmod +x ops/deploy-production.sh; ./ops/deploy-production.sh '$DEPLOY_PATH' \"\$PREV\""
      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/marbo3a_deploy
