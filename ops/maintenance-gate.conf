server {
  listen 8080;
  server_name _;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  resolver 127.0.0.11 ipv6=off valid=5s;
  set $web_upstream http://web:3000;
  set $api_upstream http://api:4000;

  location = /__gate_health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # The approved brand mark is mounted directly into the stable gate so the
  # maintenance page never depends on Next/Web being available during deploys.
  location ^~ /brand/official/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /maintenance/maintenance.js {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Keep the API reachable through the gate for installations where the host
  # reverse proxy forwards all traffic to port 3000. The API itself enforces
  # maintenance mode, while /api/system/maintenance remains readable.
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_pass $api_upstream;
  }

  location / {
    # Preserve HTTP 503 while serving the standalone maintenance document.
    # The deploy script relies on this status to prove the gate is active.
    error_page 503 @maintenance;
    if (-f /run/marbo3a-maintenance/enabled) {
      return 503;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass $web_upstream;
  }

  location @maintenance {
    root /usr/share/nginx/html;
    try_files /maintenance/index.html =503;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Retry-After "30" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
  }
}
