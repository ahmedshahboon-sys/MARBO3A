server {
  listen 8080;
  server_name _;

  resolver 127.0.0.11 ipv6=off valid=5s;
  set $web_upstream http://web:3000;
  set $api_upstream http://api:4000;

  location = /__gate_health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Keep the API reachable through the gate for installations where the host
  # reverse proxy forwards all traffic to port 3000. The API itself enforces
  # maintenance mode, while /api/system/maintenance remains readable.
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_pass $api_upstream;
  }

  location / {
    error_page 503 = @maintenance;
    if (-f /run/marbo3a-maintenance/enabled) {
      return 503;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass $web_upstream;
  }

  location @maintenance {
    root /usr/share/nginx/html;
    try_files /maintenance/index.html =503;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Retry-After "30" always;
  }
}
