<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>مربوعة قيد التحديث</title>
  <style>
    :root{color-scheme:dark;--bg:#090d12;--card:#111720;--line:#24303d;--text:#f6f7f9;--muted:#98a5b3;--orange:#ff7a00}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Arial,"Tahoma",sans-serif;background:radial-gradient(circle at 80% 10%,rgba(255,122,0,.16),transparent 34%),var(--bg);color:var(--text);display:grid;place-items:center;padding:24px}
    .card{width:min(520px,100%);background:rgba(17,23,32,.92);border:1px solid var(--line);border-radius:28px;padding:34px 28px;box-shadow:0 24px 80px rgba(0,0,0,.34);text-align:center;backdrop-filter:blur(12px)}
    .mark{width:104px;height:104px;margin:0 auto 16px;display:block;object-fit:contain;border-radius:25px;filter:drop-shadow(0 16px 30px rgba(255,122,0,.2))}
    h1{font-size:26px;margin:0 0 10px}.brand{color:var(--orange);font-weight:800;letter-spacing:.4px}.tagline{margin:3px 0 12px;color:var(--muted);font-size:12px}.message{font-size:16px;line-height:1.9;color:#d8dee6;margin:8px auto 20px;max-width:390px}.eta{font-size:14px;color:var(--muted);margin:0 0 18px}.bar{height:7px;background:#1c2631;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;width:36%;background:linear-gradient(90deg,var(--orange),#ffad4d);border-radius:99px;animation:move 1.7s ease-in-out infinite alternate}.hint{font-size:12px;color:#72808f;margin-top:16px}@keyframes move{from{transform:translateX(160%)}to{transform:translateX(-175%)}}
    @media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#f5f7fa;--card:#fff;--line:#e3e8ef;--text:#18202a;--muted:#667585}.card{box-shadow:0 18px 55px rgba(25,34,45,.12)}.message{color:#364351}.bar{background:#edf0f4}}
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <img class="mark" src="/brand/official/marbo3a-mark.png" alt="شعار مربوعة">
    <div class="brand">مربوعة · MARBO3A</div>
    <div class="tagline">أقرب الناس .. دايمًا معك</div>
    <h1>قاعدين نحدّثوا الموقع 🛠️</h1>
    <p id="message" class="message">نجّهزوا نسخة أحدث من مربوعة. الموقع بيرجع تلقائيًا أول ما يكتمل التحديث ونتأكدوا إن كل الخدمات سليمة.</p>
    <p id="eta" class="eta">عادةً الموضوع ياخذ دقائق قليلة.</p>
    <div class="bar" aria-hidden="true"><span></span></div>
    <div class="hint">مش محتاج تدير تحديث للصفحة — بنرجعوك للموقع تلقائيًا.</div>
  </main>
  <script>
    (()=>{
      const message=document.getElementById('message'),eta=document.getElementById('eta');
      const safeText=value=>typeof value==='string'&&value.trim()?value.trim():null;
      const tick=async()=>{
        try{
          const response=await fetch('/api/system/maintenance',{cache:'no-store',credentials:'include',headers:{Accept:'application/json'}});
          if(response.ok){
            const data=await response.json();
            if(!data.active){location.replace('/');return;}
            const custom=safeText(data.message);if(custom)message.textContent=custom;
            const started=data.startedAt?new Date(data.startedAt).getTime():0,minutes=Number(data.etaMinutes)||0;
            if(started&&minutes>0){
              const remain=Math.ceil((started+minutes*60000-Date.now())/60000);
              eta.textContent=remain>1?`الوقت المتوقع تقريبًا ${remain} دقيقة.`:remain===1?'متوقع نرجعوا خلال دقيقة تقريبًا.':'التحديث في مراحله الأخيرة.';
            }
          }
        }catch{}
        setTimeout(tick,5000);
      };
      tick();
    })();
  </script>
</body>
</html>
